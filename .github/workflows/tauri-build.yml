name: Build Tauri App

on:
  push:
    branches:
      - main
      - feature/ai-clipper-baseline
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/tauri-build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: bun install
        
      - name: Download FFmpeg sidecar
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          curl -L -O https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -j ffmpeg-master-latest-win64-gpl.zip "ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe"
          mv ffmpeg.exe apps/desktop/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          rm ffmpeg-master-latest-win64-gpl.zip
        
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./apps/desktop
          tagName: v__VERSION__
          releaseName: 'OpenCut AI v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc